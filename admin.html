<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPSA Safety - Admin Dashboard</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* ===== CSS Variables ===== */
    :root {
      --primary-gold: #ffd700;
      --primary-gold-hover: #e6c200;
      --bg-gradient-1: #0f2027;
      --bg-gradient-2: #203a43;
      --bg-gradient-3: #2c5364;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
      --text-muted: #b0bec5;
      --danger: #ff4d4d;
      --success: #00ff99;
      --pending-bg: rgba(255, 77, 77, 0.2);
      --resolved-bg: rgba(0, 255, 153, 0.2);
    }

    /* ===== Global Reset ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3));
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
    }

    /* ===== Top Navigation ===== */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      padding: 15px 30px;
      border-radius: 15px;
      margin-bottom: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand img { 
      height: 50px; 
      border-radius: 8px; 
    }
    
    .brand h2 { 
      font-size: 20px; 
      color: var(--primary-gold); 
      font-weight: 600; 
    }

    .logout-btn {
      background: var(--danger);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .logout-btn:hover { 
      background: #e60000; 
      transform: translateY(-2px); 
    }

    /* ===== Dashboard Grid Layout ===== */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    /* ===== Stat Widgets ===== */
    .stat-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    
    .stat-card i { 
      font-size: 30px; 
      margin-bottom: 10px; 
      color: var(--primary-gold); 
    }
    
    .stat-value { 
      font-size: 32px; 
      font-weight: 700; 
      margin: 5px 0; 
    }
    
    .stat-label { 
      font-size: 14px; 
      color: var(--text-muted); 
      text-transform: uppercase; 
      letter-spacing: 1px;
    }

    /* ===== Main Content Area ===== */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }

    /* ===== Forms & Inputs ===== */
    h3 { 
      margin-bottom: 15px; 
      font-weight: 500; 
      font-size: 18px; 
      border-bottom: 1px solid var(--glass-border); 
      padding-bottom: 10px;
    }
    
    .input-group { margin-bottom: 15px; }
    
    input, select {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: white;
      outline: none;
      transition: 0.3s;
    }
    
    input:focus, select:focus { border-color: var(--primary-gold); }
    select option { background: #0f2027; color: white; }

    .action-btn {
      width: 100%;
      background: var(--primary-gold);
      color: #111;
      border: none;
      padding: 12px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    
    .action-btn:hover { background: var(--primary-gold-hover); }

    /* ===== Table Styles ===== */
    .table-container { overflow-x: auto; }
    
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    
    .filter-bar select { width: 200px; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    
    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid var(--glass-border);
    }
    
    th { 
      color: var(--primary-gold); 
      font-weight: 600; 
      text-transform: uppercase; 
      font-size: 13px; 
    }
    
    tr:hover { background: rgba(255, 255, 255, 0.03); }
    
    .status-badge {
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
    }
    
    .status-pending { 
      background: var(--pending-bg); 
      color: var(--danger); 
      border: 1px solid var(--danger); 
    }
    
    .status-resolved { 
      background: var(--resolved-bg); 
      color: var(--success); 
      border: 1px solid var(--success); 
    }

    .btn-sm {
      background: rgba(255,255,255,0.1);
      color: white;
      border: 1px solid var(--glass-border);
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      transition: 0.3s;
      margin-right: 5px;
    }
    
    .btn-sm:hover { background: rgba(255,255,255,0.2); }
    
    .btn-resolve { 
      background: rgba(0, 255, 153, 0.2); 
      color: var(--success); 
      border-color: var(--success); 
    }
    
    .btn-resolve:hover { 
      background: var(--success); 
      color: #111; 
    }

    /* ===== Toast Notification ===== */
    #toast {
      position: fixed; 
      bottom: 30px; 
      right: 30px;
      background: var(--glass-bg); 
      backdrop-filter: blur(10px);
      border-left: 4px solid var(--success);
      padding: 15px 20px; 
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transform: translateX(150%); 
      transition: transform 0.4s ease;
      z-index: 1000;
    }
    
    #toast.show { transform: translateX(0); }
    #toast.error { border-left-color: var(--danger); }

    /* ===== Mobile Responsiveness ===== */
    @media (max-width: 1024px) {
      .dashboard-grid, .main-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="brand">
      <img src="KRAAA.webp" alt="UPSA Logo" onerror="this.src='https://via.placeholder.com/50x50.png?text=UPSA'">
      <h2>Admin Control Center</h2>
    </div>
    <button class="logout-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </nav>

  <div class="dashboard-grid">
    <div class="glass-card stat-card">
      <i class="fa-solid fa-file-shield"></i>
      <div class="stat-value" id="valTotal">0</div>
      <div class="stat-label">Total Reports</div>
    </div>
    <div class="glass-card stat-card" style="border-bottom: 3px solid var(--danger);">
      <i class="fa-solid fa-triangle-exclamation" style="color: var(--danger);"></i>
      <div class="stat-value" id="valPending" style="color: var(--danger);">0</div>
      <div class="stat-label">Pending Action</div>
    </div>
    <div class="glass-card stat-card" style="border-bottom: 3px solid var(--success);">
      <i class="fa-solid fa-check-double" style="color: var(--success);"></i>
      <div class="stat-value" id="valResolved" style="color: var(--success);">0</div>
      <div class="stat-label">Resolved Cases</div>
    </div>
  </div>

  <div class="main-grid">
    
    <div class="left-column">
      
      <div class="glass-card" style="margin-bottom: 20px;">
        <h3><i class="fa-solid fa-bullhorn" style="color: var(--primary-gold);"></i> Broadcast Security Alert</h3>
        <div class="input-group">
          <input id="alertMessage" type="text" placeholder="E.g., Evacuate North Wing">
        </div>
        <div class="input-group">
          <input id="alertLocation" type="text" placeholder="E.g., Main Library">
        </div>
        <button class="action-btn" onclick="sendAlert()"><i class="fa-solid fa-paper-plane"></i> Send Alert to All</button>
      </div>

      <div class="glass-card">
        <h3><i class="fa-solid fa-chart-pie" style="color: var(--primary-gold);"></i> Crime Analytics</h3>
        <canvas id="crimeChart"></canvas>
      </div>

    </div>

    <div class="right-column">
      <div class="glass-card table-container">
        
        <div class="filter-bar">
          <h3><i class="fa-solid fa-list"></i> Incident Database</h3>
          <select id="filterType">
            <option value="">All Report Types</option>
            <option value="Harassment">Harassment</option>
            <option value="Theft">Theft</option>
            <option value="Assault">Assault</option>
            <option value="Normal">Normal</option>
          </select>
        </div>

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Type & Location</th>
              <th>Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            </tbody>
        </table>

      </div>
    </div>

  </div>

  <div id="toast">Notification Message</div>

<script>
  // ==========================================
  // 1. VARIABLES & DOM ELEMENTS
  // ==========================================
  const tableBody = document.getElementById("tableBody");
  const filterType = document.getElementById("filterType");
  const logoutBtn = document.getElementById("logoutBtn");
  let reportsData = [];
  const token = localStorage.getItem("token");

  // ==========================================
  // 2. AUTHENTICATION & INITIALIZATION
  // ==========================================
  if (!token) {
    window.location.href = "index.html";
  }

  logoutBtn.addEventListener("click", () => {
    localStorage.removeItem("token");
    window.location.href = "index.html";
  });

  document.addEventListener("DOMContentLoaded", () => {
    loadData();
  });

  filterType.addEventListener("change", displayReports);

  // ==========================================
  // 3. API FETCH FUNCTIONS
  // ==========================================
  function loadData() {
    fetch("https://upsa-safety-system.onrender.com/reports", {
      headers: { Authorization: token }
    })
    .then(res => res.json())
    .then(data => {
      reportsData = data || [];
      displayReports();
      updateDashboardWidgets();
      renderChart();
    })
    .catch(err => {
      console.error(err);
      showToast("Could not connect to database. Is server running?", true);
    });

    // Optional: Fetch server-side stats
    fetch("hhttps://upsa-safety-system.onrender.com/stats", {
      headers: { Authorization: token }
    })
    .then(res => res.json())
    .then(data => {
      document.getElementById("valTotal").textContent = data.total || reportsData.length;
      document.getElementById("valPending").textContent = data.pending || 0;
      document.getElementById("valResolved").textContent = data.resolved || 0;
    })
    .catch(err => console.log("Stats API skipped/failed"));
  }

  // ==========================================
  // 4. UI RENDERING FUNCTIONS
  // ==========================================
  function updateDashboardWidgets() {
    const total = reportsData.length;
    const pending = reportsData.filter(r => r.status === "Pending").length;
    const resolved = reportsData.filter(r => r.status === "Resolved").length;
    
    document.getElementById("valTotal").textContent = total;
    document.getElementById("valPending").textContent = pending;
    document.getElementById("valResolved").textContent = resolved;
  }

  function displayReports() {
    const filter = filterType.value;
    tableBody.innerHTML = "";

    const filteredData = reportsData.filter(r => !filter || r.report_type === filter);

    if(filteredData.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:gray;">No reports found.</td></tr>`;
      return;
    }

    filteredData.forEach(r => {
      const isPending = r.status === "Pending";
      const statusClass = isPending ? "status-pending" : "status-resolved";
      const date = new Date(r.created_at).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
      
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>#${r.id}</td>
        <td>
          <strong>${r.report_type}</strong><br>
          <span style="font-size:12px; color:var(--text-muted);"><i class="fa-solid fa-location-dot"></i> ${r.location}</span>
        </td>
        <td>${date}</td>
        <td><span class="status-badge ${statusClass}">${r.status}</span></td>
        <td>
          <button class="btn-sm" onclick="downloadReport(${r.id})" title="Download TXT"><i class="fa-solid fa-download"></i></button>
          ${isPending ? `<button class="btn-sm btn-resolve" onclick="updateStatus(${r.id}, 'Resolved')" title="Mark as Resolved"><i class="fa-solid fa-check"></i></button>` : ""}
        </td>
      `;
      tableBody.appendChild(tr);
    });
  }

  function renderChart() {
    const ctx = document.getElementById("crimeChart");
    const counts = { Harassment: 0, Theft: 0, Assault: 0, Normal: 0 };

    reportsData.forEach(r => {
      if(counts[r.report_type] !== undefined) {
        counts[r.report_type]++;
      }
    });

    if (window.crimeChart instanceof Chart) {
      window.crimeChart.destroy();
    }

    Chart.defaults.color = '#b0bec5';
    Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.1)';

    window.crimeChart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: Object.keys(counts),
        datasets: [{
          label: "Reported Incidents",
          data: Object.values(counts),
          backgroundColor: "#ffd700",
          borderRadius: 5
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, ticks: { stepSize: 1 } }
        }
      }
    });
  }

  // ==========================================
  // 5. USER ACTIONS (Updates, Alerts, Downloads)
  // ==========================================
  function updateStatus(id, status) {
    fetch(`hhttps://upsa-safety-system.onrender.com/${id}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        Authorization: token
      },
      body: JSON.stringify({ status })
    })
    .then(r => r.json())
    .then(() => {
      showToast("Report marked as Resolved!");
      loadData(); 
    })
    .catch(err => showToast("Failed to update status", true));
  }

  function sendAlert() {
    const message = document.getElementById("alertMessage").value;
    const location = document.getElementById("alertLocation").value;

    if(!message || !location) {
      showToast("Please fill in both message and location", true);
      return;
    }

    fetch("https://upsa-safety-system.onrender.com/alerts", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: token 
      },
      body: JSON.stringify({ message, location })
    })
    .then(res => res.json())
    .then(data => {
      if(data.success || data.message) {
        showToast("Broadcast alert sent to all units!");
        document.getElementById("alertMessage").value = "";
        document.getElementById("alertLocation").value = "";
      } else {
        showToast("Server rejected the alert.", true);
      }
    })
    .catch(err => {
      console.error(err);
      showToast("Server error. Check connection.", true);
    });
  }

  function downloadReport(id) {
    const report = reportsData.find(r => r.id === id);
    if(!report) return;

    const content = `
========================================
       UPSA SAFETY POLICING REPORT      
========================================
Report ID:     ${report.id}
Incident Type: ${report.report_type}
Location:      ${report.location}
Date Logged:   ${new Date(report.created_at).toLocaleString()}
Current Status:${report.status}
----------------------------------------
Description: 
${report.description}
========================================
Generated by UPSA Admin Portal`;

    const blob = new Blob([content], { type: "text/plain" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `UPSA_Incident_Report_${report.id}.txt`;
    link.click();
  }

  // ==========================================
  // 6. UTILITIES
  // ==========================================
  function showToast(message, isError = false) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.className = isError ? "error show" : "show";
    setTimeout(() => { toast.classList.remove("show"); }, 3500);
  }

</script>

</body>
</html>
